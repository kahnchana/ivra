<!DOCTYPE html>
<html lang="en">
<head>

  <title>IVRA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f4f9;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      text-align: center;
      padding: 2rem 3rem;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 0.5rem;
      color: #4A90E2;
    }

    p {
      font-size: 1.25rem;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>IVRA</h1>
    <p>Intelligent Vision-Robotics Architecture</p>

</html>
